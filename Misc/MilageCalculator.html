<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
  <meta name="generator" content="HTML Tidy for Windows (vers 25 March 2009), see www.w3.org">
  <style type="text/css">
  .c {background: lightgreen;}
  </style>

  <title>Simple Javascript Calculator</title>
  <script language="javascript" type="text/javascript">
function math(){
    num1=Number(document.calculator.num1.value);
    num2=Number(document.calculator.num2.value);
    num3=Number(document.calculator.num3.value);
    num4=Number(document.calculator.num4.value);
    total=num1/num2*num3/num4;
    document.calculator.total.value=total;
  }
  </script>
</head>

<body>
  <center>
    <form name="calculator" action="" id="calculator">
      <table border="0" summary="">
        <tr>
          <th>Miles /</th>

          <th>MPG *</th>

          <th>$/Gal /</th>

          <th>People</th>
        </tr>

        <tr>
          <td><input type="text" name="num1" size="2" value="400"> /</td>

          <td><input type="text" name="num2" size="2" value="25"> *</td>

          <td><input type="text" name="num3" size="2" value="3.50"> /</td>

          <td><input type="text" name="num4" size="2" value="4"></td>
        </tr>

        <tr>
          <th colspan="4"><input type="button" value="(Miles) / (MPG) * ($/Gal) / (People)" class="c" onclick="javascript:math();"></th>
        </tr>

        <tr>
          <th colspan="4">$<input type="text" name="total" class="c" size="4" value="Fuel Cost" disabled="disabled"> / Person</th>
        </tr>
      </table>
      <hr>
      <script language="javascript" type="text/javascript">
document.write( document.lastModified ) 
      </script>
    </form>
  </center>
</body>
</html>
