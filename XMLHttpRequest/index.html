<div id=demo>string</div>

<script>
// 1. Create an XMLHttpRequest object
const xhr = new XMLHttpRequest();

// 2. Configure the request with open()
xhr.open('GET', 'http://localhost:63/XMLHttpRequest/include.html', true); // Method, URL, Asynchronous (true)

// 3. Set up an event handler for when the request is complete
xhr.onload = function() {
    // Check if the request was successful (status 200 is "OK")
    if (xhr.status === 200) {
        // Parse the response, typically JSON, and use the data
        const data = xhr.responseText;
        console.log(data);
        // You can update the webpage content here
        document.getElementById("demo").innerHTML = xhr.responseText;
    } else {
        // Handle HTTP errors
        console.error('Error: ' + xhr.status + ' ' + xhr.statusText);
    }
};

// 4. Set up an event handler for network errors
xhr.onerror = function() {
    console.error("Network error occurred");
};

// 5. Send the request
xhr.send(); // Used for GET requests; for POST, you can pass data to send()
</script>
